<style>
/* Layout: one centered column (max 800px). Blue = the site and the senpai, yellow = "the gap" (highlighter marks on differences). */
:root{
  --bg:#F3F7FF; --surface:#FFFFFF; --surface-2:#E8F0FF; --ink:#13203F; --muted:#56637F; --line:#D3DFF3;
  --blue:#1E63E9; --blue-ink:#0E3A93; --blue-soft:#DCE8FF; --on-blue:#FFFFFF;
  --hero:#1E63E9; --hero-ink:#FFFFFF; --hero-sub:#D6E4FF;
  --yellow:#FFD234; --yellow-press:#E3AE00; --yellow-soft:#FFF2BA; --yellow-ink:#6A4B00; --on-yellow:#2A2000;
  --mark:rgba(255,210,52,.85);
  --good:#177A50; --good-soft:#DBF3E6; --danger:#C2361F;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1330; --surface:#131E45; --surface-2:#1A2958; --ink:#EDF2FF; --muted:#A8B5D8; --line:#2A3B72;
  --blue:#77A4FF; --blue-ink:#C4D6FF; --blue-soft:#1F3373; --on-blue:#0B1330;
  --hero:#1A3F9E; --hero-ink:#FFFFFF; --hero-sub:#C9D8FF;
  --yellow:#FFD234; --yellow-press:#B98D00; --yellow-soft:#3A3115; --yellow-ink:#FFE08A; --on-yellow:#2A2000;
  --mark:rgba(255,210,52,.38);
  --good:#62D7A0; --good-soft:#123A2B; --danger:#FF8C78; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1330; --surface:#131E45; --surface-2:#1A2958; --ink:#EDF2FF; --muted:#A8B5D8; --line:#2A3B72;
  --blue:#77A4FF; --blue-ink:#C4D6FF; --blue-soft:#1F3373; --on-blue:#0B1330;
  --hero:#1A3F9E; --hero-ink:#FFFFFF; --hero-sub:#C9D8FF;
  --yellow:#FFD234; --yellow-press:#B98D00; --yellow-soft:#3A3115; --yellow-ink:#FFE08A; --on-yellow:#2A2000;
  --mark:rgba(255,210,52,.38);
  --good:#62D7A0; --good-soft:#123A2B; --danger:#FF8C78; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--blue)}
h1,h2,h3{font-family:var(--f-display);line-height:1.35;text-wrap:balance;word-break:auto-phrase;margin:0}
h1{font-size:clamp(1.6rem,4.6vw,2.4rem);font-weight:900}
h2{font-size:1.35rem;font-weight:900}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.wrap{max-width:800px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:900;font-size:1.15rem}
.logo i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--yellow);color:var(--on-yellow);display:grid;place-items:center;font-size:.95rem}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem;padding:.35em .8em;border-radius:999px}
.nav a[aria-current="page"]{background:var(--blue-soft);color:var(--blue-ink)}
.sample{background:var(--yellow-soft);color:var(--yellow-ink);font-size:.82rem;font-weight:500}
.sample .wrap{padding-block:6px}

main{padding-block:24px 56px}
main > .wrap{display:flex;flex-direction:column;gap:28px}
.section{display:flex;flex-direction:column;gap:14px}
.lead{color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;border-radius:999px;border:2px solid transparent;font-family:var(--f-display);font-weight:700;padding:.7em 1.4em;text-decoration:none;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn-yellow{background:var(--yellow);color:var(--on-yellow);box-shadow:0 4px 0 var(--yellow-press)}
.btn-yellow:active{box-shadow:0 2px 0 var(--yellow-press)}
.btn-blue{background:var(--blue);color:var(--on-blue)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-big{font-size:1.12rem;padding:.85em 1.8em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.link-btn{background:none;border:0;padding:0;color:var(--blue);font-weight:700;text-decoration:underline}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:28px;padding:clamp(22px,5vw,44px);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:var(--yellow);opacity:.18;right:-70px;top:-80px}
.hero h1{color:var(--hero-ink)}
.hero h1 em{font-style:normal;color:var(--yellow)}
.hero .lead{color:var(--hero-sub);margin-top:12px}
.hero .row{margin-top:20px}
.hero .btn-ghost{background:transparent;color:var(--hero-ink);border-color:var(--hero-sub)}
.hero-card{background:var(--surface);color:var(--ink);border-radius:20px;padding:16px;position:relative;z-index:1;box-shadow:0 10px 30px rgba(8,20,60,.25)}
.hero-card .cap{font-size:.78rem;color:var(--muted);font-weight:700}

.mark{background:linear-gradient(transparent 58%,var(--mark) 58%);padding:0 .1em}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:0;margin:0;list-style:none;counter-reset:s}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;counter-increment:s}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--blue);color:var(--on-blue);font-family:var(--f-display);font-weight:900;font-size:.85rem;margin-bottom:6px}
.steps b{display:block;font-family:var(--f-display)}
.steps span{font-size:.86rem;color:var(--muted)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.list{display:flex;flex-direction:column;gap:12px}
.s-card{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);transition:border-color .15s}
.s-card:hover{border-color:var(--blue)}
.s-card.best{border:2px solid var(--blue)}
.s-head{display:flex;align-items:center;gap:12px}
.s-head > div{min-width:0;flex:1}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:900}
.avatar.lg{width:60px;height:60px;font-size:1.3rem}
.s-name{font-family:var(--f-display);font-weight:900;font-size:1.08rem}
.s-sub{font-size:.85rem;color:var(--muted)}
.score{flex:none;text-align:center;background:var(--yellow);color:var(--on-yellow);border-radius:14px;padding:4px 10px;font-family:var(--f-display);font-weight:900;line-height:1.2}
.score small{display:block;font-size:.66rem;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.78rem;padding:.15em .65em;border-radius:8px;background:var(--surface-2);color:var(--muted);font-weight:500}
.tag-b{background:var(--blue-soft);color:var(--blue-ink)}
.tag-y{background:var(--yellow-soft);color:var(--yellow-ink)}
.hits{display:flex;flex-wrap:wrap;gap:6px}
.hit{font-size:.78rem;font-weight:700;color:var(--good);background:var(--good-soft);padding:.15em .65em;border-radius:999px}
.hit::before{content:"✓ "}
.s-sum{font-size:.93rem}

/* question */
.q{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,5vw,44px);text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.dots{display:flex;gap:8px}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--blue);width:26px;border-radius:999px}
.q .lead{max-width:30em}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:560px;margin-top:8px}
.choice{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px 14px;border-radius:22px;border:2px solid var(--line);background:var(--surface);transition:border-color .15s,transform .08s}
.choice:hover{border-color:var(--blue)}
.choice:active{transform:translateY(2px)}
.choice b{font-family:var(--f-display);font-size:1.25rem;font-weight:900}
.choice span{font-size:.82rem;color:var(--muted)}
.choice:active{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.choice:active span{color:var(--on-blue)}
.flowmap{font-size:.82rem;color:var(--muted)}

/* form */
.field{display:flex;flex-direction:column;gap:8px;padding-block:14px;border-top:1px solid var(--line)}
.field:first-child{border-top:0;padding-top:0}
.field > label,.field > .lbl{font-weight:700;font-family:var(--f-display)}
.lbl small{font-family:var(--f-body);font-weight:500;color:var(--muted);margin-left:.5em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.4em .95em;font-size:.9rem;font-weight:500}
.chip:hover{border-color:var(--blue)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.chip.y[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:var(--on-yellow)}
.err{color:var(--danger);font-size:.85rem;font-weight:700}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--blue)}
.range output{min-width:5em;font-weight:900;font-family:var(--f-display);font-size:1.1rem}
input[type="text"].text{font:inherit;width:100%;max-width:26em;padding:.55em .8em;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.hint{font-size:.85rem;color:var(--muted)}
.hint b{color:var(--blue-ink)}
input[type="number"]{font:inherit;width:7em;padding:.45em .7em;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}

/* me bar */
.me{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface-2);border-radius:16px;padding:10px 14px;font-size:.88rem}
.me b{font-family:var(--f-display)}

/* compare */
.cmp{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.cmp > div{padding:10px 12px;border-top:1px solid var(--line);min-width:0;font-size:.92rem}
.cmp .h{border-top:0;font-family:var(--f-display);font-weight:900;font-size:.88rem}
.cmp .h.s{background:var(--blue-soft);color:var(--blue-ink)}
.cmp .h.m{background:var(--yellow-soft);color:var(--yellow-ink)}
.cmp .l{color:var(--muted);font-size:.84rem;font-weight:700}
.note{display:inline-block;margin-top:4px;font-size:.76rem;font-weight:700;padding:.1em .6em;border-radius:999px}
.note.gap{background:var(--yellow);color:var(--on-yellow)}
.note.ok{background:var(--good-soft);color:var(--good)}
.bubble{background:var(--blue-soft);color:var(--ink);border-radius:18px 18px 18px 4px;padding:14px 16px;font-size:.95rem}
.bubble b{display:block;font-family:var(--f-display);color:var(--blue-ink);font-size:.85rem}
.gapline{font-family:var(--f-display);font-weight:900;font-size:1.1rem}

/* profile */
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:.78rem;color:var(--muted);font-weight:700}
.facts dd{margin:0;font-size:.93rem}
.quote{font-size:1.02rem;border-left:4px solid var(--yellow);padding-left:12px;border-radius:0}
.warn{background:var(--yellow-soft);color:var(--ink);border-radius:16px;padding:14px 16px}
.warn b{color:var(--yellow-ink);font-family:var(--f-display)}

/* timeline */
.tl{display:flex;flex-direction:column;gap:0}
.tl-row{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px dashed var(--line)}
.tl-row:first-child{border-top:0}
.tl-g{font-family:var(--f-display);font-weight:900;font-size:1.05rem;color:var(--blue-ink)}
.tl-row.now .tl-g{background:var(--yellow);color:var(--on-yellow);border-radius:10px;text-align:center;height:max-content;padding:2px 0}
.bar{display:flex;align-items:center;gap:10px}
.bar span{display:block;height:12px;border-radius:999px;background:var(--blue);min-width:6px}
.bar em{font-style:normal;font-weight:700;font-size:.85rem;white-space:nowrap}
.tl-meta{font-size:.82rem;color:var(--muted);margin:4px 0 6px}
.tl-row p{font-size:.92rem}

/* books */
.b-card{display:flex;flex-direction:column;gap:8px}
.b-card.rec{border:2px solid var(--yellow)}
.b-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.b-name{font-family:var(--f-display);font-weight:900;font-size:1.05rem}
.b-name a{color:var(--ink);text-decoration:none}
.b-name a:hover{text-decoration:underline}
.lvl{display:inline-flex;gap:3px;vertical-align:middle}
.lvl i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.lvl i.on{background:var(--blue)}
.kv{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:4px 10px;font-size:.9rem}
.kv dt{color:var(--muted);font-weight:700;font-size:.82rem;padding-top:.15em}
.kv dd{margin:0}
.good{color:var(--good)}
.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat div{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.3rem;font-weight:900}
.stat span{font-size:.78rem;color:var(--muted);font-weight:700}
.filters{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.filters .f{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.filters .f > span{font-size:.8rem;font-weight:700;color:var(--muted);min-width:4.5em}
.filters .chip{font-size:.82rem;padding:.3em .8em}
.count{font-family:var(--f-display);font-weight:900}
footer{border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{padding-block:20px;font-size:.82rem;color:var(--muted)}

@media (max-width:720px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:minmax(0,1fr)}
  .stat{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .facts{grid-template-columns:minmax(0,1fr)}
  .cmp > div{padding:9px 8px;font-size:.86rem}
  .choices{grid-template-columns:minmax(0,1fr)}
  .nav a{font-size:.82rem;padding:.3em .6em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const jukuCat = j => j === '塾なし' ? 'none' : (j === '鉄緑会' || j === 'SEG') ? 'tetsu' : j.startsWith('東進') ? 'toshin' : (j === '河合塾' || j === '駿台') ? 'yobiko' : j.startsWith('Z会') ? 'tsushin' : 'jimoto';
const initial = p => p.name.charAt(0);
const lvOf = (p, g, s) => { const i = subjects(p).indexOf(s); return i < 0 ? undefined : p.levels[g][i]; };
const lvlDots = n => `<span class="lvl" aria-label="${n}／5">${[1,2,3,4,5].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`;

/* book master */
const BOOKS = []; const bookIdx = {};
P.forEach(p => p.books.forEach(b => {
  if (!(b.name in bookIdx)) { bookIdx[b.name] = BOOKS.length; BOOKS.push({ i: BOOKS.length, name: b.name, subj: b.subj, kind: b.kind, uses: [] }); }
  BOOKS[bookIdx[b.name]].uses.push({ p, b });
}));

/* state */
const blank = { bunri: null, grade: null, rui: [], region: null, shubetsu: null, juku: null, jukuText: '', bukatsu: null, strong: null, weak: null, hours: 2, hensachi: null, decided: null };
let me = Object.assign({}, blank);
try { const s = JSON.parse(localStorage.getItem('senpai-me') || 'null'); if (s) me = Object.assign({}, blank, s); } catch (e) {}
if (!Array.isArray(me.rui)) me.rui = me.rui ? [me.rui] : [];
if (typeof me.juku === 'string') { me.jukuText = JUKU_L[me.juku] || ''; me.juku = [me.juku]; }
const save = () => { try { localStorage.setItem('senpai-me', JSON.stringify(me)); } catch (e) {} };
let errs = {};
const bf = { bunri: '', region: '', gen: '', juku: '', style: '' };
const bk = { subj: '', kind: '' };
const hasMe = () => !!(me.grade && me.bunri);

/* matching */
function match(p) {
  let s = 0, max = 0; const hits = [];
  const add = (ok, pts, label) => { max += pts; if (ok) { s += pts; if (label) hits.push(label); } };
  if (me.bunri) { max += 4; if (p.bunri === me.bunri) s += 4; else s -= 12; }
  if (me.rui.length) add(me.rui.includes(p.rui), 2, `志望の科類が同じ（${p.rui}）`);
  if (me.region) add(p.region === me.region, 3, `${me.region}の出身`);
  if (me.shubetsu) add(p.shubetsu === me.shubetsu, 2, '高校のタイプが同じ');
  if (me.juku && me.juku.length) { const c = jukuCat(p.juku); add(me.juku.includes(c), 3, c === 'none' ? '塾なし' : `${JUKU_L[c]}に通っていた`); }
  if (me.bukatsu) add((p.bukatsu !== null) === (me.bukatsu === 'yes'), 1, me.bukatsu === 'yes' ? '部活と両立' : '部活なし');
  if (me.weak) add(p.weak === me.weak, 3, `${me.weak}が苦手`);
  if (me.strong) add(p.strong === me.strong, 2, `${me.strong}が得意`);
  if (me.grade && me.hours != null) add(Math.abs(p.hours[me.grade] - me.hours) <= 1, 2, `${me.grade}の勉強時間が近い`);
  if (me.grade && me.hensachi && p.hensachi[me.grade] != null) add(Math.abs(p.hensachi[me.grade] - me.hensachi) <= 3, 2, `${me.grade}の偏差値が近い`);
  return { p, pct: max ? Math.max(0, Math.round(s / max * 100)) : 0, hits };
}
const ranked = () => P.map(match).sort((a, b) => b.pct - a.pct || a.p.id.localeCompare(b.p.id));

/* pieces */
function sCard(p, m, best) {
  return `<a class="card s-card${best ? ' best' : ''}" href="#s-${p.id}">
    <div class="s-head"><span class="avatar">${esc(initial(p))}</span>
      <div><div class="s-name">${esc(p.name)}</div><div class="s-sub">${p.year}年度入学・${esc(p.rui)}・${esc(p.gen)}</div></div>
      ${m ? `<span class="score num">${m.pct}%<small>近さ</small></span>` : ''}</div>
    <div class="tags"><span class="tag tag-b">${esc(p.pref)}</span><span class="tag">${esc(p.shubetsu)}</span><span class="tag">${esc(p.juku)}</span><span class="tag">得意 ${esc(p.strong)}</span><span class="tag tag-y">苦手 ${esc(p.weak)}</span></div>
    ${m && m.hits.length ? `<div class="hits">${m.hits.map(h => `<span class="hit">${esc(h)}</span>`).join('')}</div>` : ''}
    <p class="s-sum">${esc(p.summary)}</p></a>`;
}
function meBar() {
  if (!hasMe()) return '';
  const bits = [me.grade, me.bunri, me.region, me.jukuText && `塾：${me.jukuText}`, me.weak && `${me.weak}が苦手`, `平日${fh(me.hours)}時間`].filter(Boolean);
  return `<div class="me"><span>あなた：</span><b>${bits.map(esc).join('・')}</b><a href="#form" style="margin-left:auto;font-weight:700">条件を変える</a></div>`;
}
const chip = (act, field, val, label, on, cls = '') => `<button type="button" class="chip ${cls}" data-act="${act}" data-field="${field}" data-val="${esc(val)}" aria-pressed="${on}">${esc(label)}</button>`;
const dots = n => `<div class="dots" aria-label="質問 ${n}／3">${[1,2,3].map(i => `<span class="${i === n ? 'on' : ''}"></span>`).join('')}</div>`;

/* views */
function vTop() {
  const ex = P.find(q => q.region === '四国' && q.nro === 0 && lvOf(q, '高2', q.weak) <= 2 && q.hensachi['高2']) || P[0];
  const myH = Math.max(0.5, ex.hours['高2'] - 1.5), myD = ex.hensachi['高2'] - 4;
  const picks = [ex, P.find(q => q.nro === 1 && q.style === 'ronin_kiso'), P.find(q => q.style === 'gyakuten'), P.find(q => q.juku === '鉄緑会' && q.nro === 0)].filter(Boolean).slice(0, 3);
  return `
  <section class="hero">
    <div>
      <h1>自分に似た先輩と、<em>いまの差</em>を見てみよう。</h1>
      <p class="lead">学年、住んでいる地域、塾、苦手な科目を答えると、境遇の近い東大の先輩が見つかります。先輩が同じ学年だったころと今のあなたを並べて、差を埋める参考書まで確認できます。</p>
      <div class="row"><a class="btn btn-yellow btn-big" href="#q-bunri">はじめる（2分）</a><a class="btn btn-ghost" href="#browse">先輩を一覧で見る</a></div>
    </div>
    <div class="hero-card" aria-label="比較の例">
      <p class="cap">例：${esc(ex.name)}（${esc(ex.pref)}・${esc(ex.rui)}）の高2と、あなた</p>
      <div class="cmp" style="margin-top:8px">
        <div class="h"></div><div class="h s">先輩の高2</div><div class="h m">あなた（例）</div>
        <div class="l">平日の勉強</div><div class="num">${fh(ex.hours['高2'])}時間</div><div class="num">${fh(myH)}時間<br><span class="note gap">あと${fh(ex.hours['高2'] - myH)}時間</span></div>
        <div class="l">模試の偏差値</div><div class="num">${ex.hensachi['高2']}</div><div class="num">${myD}<br><span class="note gap">あと${ex.hensachi['高2'] - myD}</span></div>
        <div class="l">${esc(ex.weak)}</div><div>${LVL(lvOf(ex, '高2', ex.weak))}</div><div>苦手<br><span class="note ok">先輩も苦手だった</span></div>
      </div>
    </div>
  </section>
  <section class="section">
    <h2>使い方</h2>
    <ol class="steps">
      <li><b>質問に答える</b><span>はい・いいえで進んで、今の自分の状態を入力します。</span></li>
      <li><b>似ている先輩を見る</b><span>100人の中から、境遇の近い先輩が近い順に並びます。</span></li>
      <li><b>差と参考書を確認する</b><span>同じ学年のころの先輩と比べて、足りないところと使った本が分かります。</span></li>
    </ol>
  </section>
  <section class="section">
    <h2>たとえば、こんな先輩がいます</h2>
    <div class="list">${picks.map(p => sCard(p)).join('')}</div>
    <div><a class="btn btn-ghost" href="#browse">100人の先輩を見る</a></div>
  </section>`;
}

function vQ(step) {
  if (step === 'bunri') return `<section class="q">${dots(1)}
    <h1>文系か理系か、もう決まってる？</h1>
    <p class="lead">決まっていなくても大丈夫。先輩を眺めるところから始められます。</p>
    <div class="choices">
      <button class="choice" data-act="go" data-val="q-pick"><b>決まってる</b><span>次の質問へ</span></button>
      <button class="choice" data-act="go" data-val="browse"><b>まだ迷ってる</b><span>先輩を一覧で見る</span></button>
    </div></section>`;
  if (step === 'pick') return `<section class="q">${dots(2)}
    <h1>どっち？</h1>
    <div class="choices">
      <button class="choice" data-act="pick" data-val="文系"><b>文系</b><span>文科一類・二類・三類</span></button>
      <button class="choice" data-act="pick" data-val="理系"><b>理系</b><span>理科一類・二類・三類</span></button>
    </div>
    <a href="#q-bunri" class="small">← 前の質問</a></section>`;
  return `<section class="q">${dots(3)}
    <h1>いちばん伸ばしたい科目は、もう分かってる？</h1>
    <p class="lead">分かっているなら、参考書から探すのが早道。まだなら、先輩と比べて見つけましょう。</p>
    <div class="choices">
      <button class="choice" data-act="goal" data-val="yes"><b>分かってる</b><span>参考書から探す</span></button>
      <button class="choice" data-act="goal" data-val="no"><b>まだ分からない</b><span>先輩と比べて見つける</span></button>
    </div>
    <a href="#q-pick" class="small">← 前の質問</a></section>`;
}

function vForm() {
  const subj = me.bunri ? SUBJ[me.bunri] : SUBJ['文系'];
  const f = (label, body, err, opt) => `<div class="field"><div class="lbl">${label}${opt ? '<small>分かれば</small>' : ''}</div>${body}${err ? `<p class="err" role="alert">${err}</p>` : ''}</div>`;
  const group = (field, opts, optional = true, cls = '') => `<div class="chips">${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return chip('set', field, v, l, me[field] === v, cls); }).join('')}</div>`;
  return `
  <section class="section">
    <h1>いまのあなたのこと</h1>
    <p class="lead">分かるところだけで大丈夫。答えた項目が多いほど、近い先輩を見つけやすくなります。</p>
  </section>
  <section class="card">
    ${f('文系・理系', group('bunri', ['文系', '理系']), errs.bunri)}
    ${f('学年', group('grade', GRADES), errs.grade)}
    ${me.bunri ? `<div class="field"><div class="lbl">志望の科類<small>いくつでも選べます</small></div><div class="chips">${RUI[me.bunri].map(r => chip('multi', 'rui', r, r, me.rui.includes(r))).join('')}</div></div>` : ''}
    ${f('住んでいる地域', group('region', REGIONS), null, true)}
    ${f('通っている高校', group('shubetsu', SHU), null, true)}
    <div class="field"><label for="juku">塾・予備校<small style="font-family:var(--f-body);font-weight:500;color:var(--muted);margin-left:.5em">名前をそのまま書いてOK（ひらがな・カタカナでも大丈夫）</small></label>
      <input type="text" class="text" id="juku" autocomplete="off" placeholder="例：東進、かわいじゅく、行ってない" value="${esc(me.jukuText)}">
      <p class="hint" id="juku-hint">${jukuHint()}</p></div>
    ${f('部活', group('bukatsu', [['yes', 'している'], ['no', 'していない']]), null, true)}
    ${f('いちばん得意な科目', group('strong', subj), null, true)}
    ${f('いちばん苦手な科目', group('weak', subj, true, 'y'), null, true)}
    <div class="field"><label for="hours">平日の勉強時間（学校の授業以外）</label>
      <div class="range"><input type="range" id="hours" min="0" max="10" step="0.5" value="${me.hours}"><output id="hours-out" class="num">${fh(me.hours)}時間</output></div></div>
    <div class="field"><label for="hensachi">最近の模試の偏差値<small style="font-family:var(--f-body);font-weight:500;color:var(--muted);margin-left:.5em">分かれば（全国模試の総合）</small></label>
      <input type="number" id="hensachi" min="30" max="85" step="1" inputmode="numeric" placeholder="例：62" value="${me.hensachi ?? ''}">
      ${errs.hensachi ? `<p class="err" role="alert">${errs.hensachi}</p>` : ''}</div>
    ${f('東大を目指し始めたのは', group('decided', DECIDED), null, true)}
  </section>
  <div class="row"><button class="btn btn-yellow btn-big" data-act="submit">似ている先輩を探す</button><button class="link-btn" data-act="clear">入力をリセット</button></div>`;
}

function vResult() {
  if (!hasMe()) return `<section class="card section"><h2>まずは今の状態を教えてください</h2><p class="lead">学年と文系・理系を選ぶと、近い先輩が出てきます。</p><div><a class="btn btn-yellow" href="#form">入力する</a></div></section>`;
  const r = ranked().slice(0, 5);
  return `
  <section class="section"><h1>あなたに近い先輩</h1><p class="lead">100人の中から、境遇の近い順に5人を選びました。気になる先輩を開くと、${esc(me.grade)}のころの先輩と比べられます。</p></section>
  ${meBar()}
  <div class="list">${r.map((m, i) => sCard(m.p, m, i === 0)).join('')}</div>
  <div class="row"><a class="btn btn-ghost" href="#browse">ほかの先輩も見る</a><a class="btn btn-ghost" href="#books">参考書から探す</a></div>`;
}

function compareRows(p, g) {
  const rows = [];
  const sh = p.hours[g], mh = me.hours;
  rows.push({ l: '平日の勉強時間', s: `${fh(sh)}時間`, m: `${fh(mh)}時間`, n: mh < sh ? ['gap', `あと${fh(sh - mh)}時間`] : ['ok', mh === sh ? '先輩と同じ' : '先輩より多い'] });
  const sd = p.hensachi[g], md = me.hensachi;
  rows.push({ l: '模試の偏差値', s: sd != null ? String(sd) : '覚えていない', m: md ? String(md) : '未入力', n: (sd != null && md) ? (md < sd ? ['gap', `あと${sd - md}`] : ['ok', '先輩と同じか上']) : null });
  if (me.weak) { const v = lvOf(p, g, me.weak); rows.push({ l: `${me.weak}（あなたの苦手）`, s: v === undefined ? '選択していない' : LVL(v), m: '苦手', n: v === undefined || v === null ? null : v >= 3 ? ['gap', `先輩は「${LV[v]}」`] : ['ok', '先輩も苦手だった'] }); }
  if (me.strong) { const v = lvOf(p, g, me.strong); rows.push({ l: `${me.strong}（あなたの得意）`, s: v === undefined ? '選択していない' : LVL(v), m: '得意', n: v == null ? null : ['ok', v >= 4 ? '先輩も得意' : 'あなたの武器'] }); }
  rows.push({ l: '東大を目指した時期', s: p.decided, m: me.decided || '未入力', n: me.decided === 'まだ迷ってる' ? ['gap', '先輩はもう決めていた'] : null });
  if (p.rank[g] != null) rows.push({ l: '校内順位', s: `${p.rank[g]}位／${p.N}人`, m: '—', n: null });
  if (g === '高3' && p.hantei['高3']) { const [a, b] = p.hantei['高3']; rows.push({ l: '冠模試の判定', s: `夏${a} → 秋${b}`, m: '—', n: null }); }
  return rows;
}

function bookCard(p, b, rec) {
  const per = b.start === b.end ? b.start : `${b.start}〜${b.end}`;
  const why = rec ? (me.weak && b.subj === me.weak ? `あなたの苦手（${me.weak}）の本` : `${me.grade}から使い始めた本`) : '';
  return `<article class="card b-card${rec ? ' rec' : ''}">
    <div class="b-top"><div><div class="b-name"><a href="#b-${bookIdx[b.name]}">${esc(b.name)}</a></div>
      <div class="tags" style="margin-top:4px"><span class="tag tag-b">${esc(b.subj === '複数' ? '複数科目' : b.subj)}</span><span class="tag">${esc(b.kind)}</span><span class="tag">${esc(per)}</span>${why ? `<span class="tag tag-y">${esc(why)}</span>` : ''}</div></div>
      <div class="small muted" style="white-space:nowrap">難易度 ${lvlDots(b.level)}</div></div>
    <dl class="kv"><dt>目的</dt><dd>${esc(b.purpose)}</dd><dt>使い方</dt><dd>${esc(b.use)}</dd><dt>良かった</dt><dd class="good">${esc(b.good)}</dd><dt>注意</dt><dd>${esc(b.bad)}</dd></dl>
  </article>`;
}

function vSenpai(id) {
  const p = byId[id];
  if (!p) return `<section class="card"><h2>その先輩は見つかりませんでした</h2><p><a href="#browse">先輩一覧へ</a></p></section>`;
  const g = hasMe() ? me.grade : null;
  const facts = [['出身', `${p.pref}（${p.region}）`], ['高校', `${p.shubetsu}・学年${p.N}人`], ['部活', p.bukatsu ? `${p.bukatsu}（${p.intai}まで）` : 'なし'], ['塾', p.juku + (p.juku_period ? `（${p.juku_period}）` : '') + (p.rojuku ? ` → 浪人時 ${p.rojuku}` : '')], ['選択科目', `${p.s1}・${p.s2}`], ['得意・苦手', `得意 ${p.strong}／苦手 ${p.weak}`], ['東大を目指した', p.decided], ['本格的に始めた', p.start], ['共通テスト', `${p.kyotsu}／${p.kyotsu_max}点` + (p.kyotsu_gen ? `（現役時 ${p.kyotsu_gen}／${p.kyotsu_gen_max}点）` : '')], ['受験スタイル', STYLE[p.style]]];
  let cmp = '';
  if (g) {
    const rows = compareRows(p, g);
    const gaps = rows.filter(r => r.n && r.n[0] === 'gap').length;
    cmp = `<section class="section">
      <h2>${esc(g)}のころの先輩と、いまのあなた</h2>
      <p class="gapline">${gaps ? `<span class="mark">差があるのは${gaps}項目</span>。黄色のところが埋めたい差です。` : '<span class="mark">大きな差はありません</span>。このペースを続けよう。'}</p>
      <div class="cmp">
        <div class="h"></div><div class="h s">先輩の${esc(g)}</div><div class="h m">あなた（${esc(g)}）</div>
        ${rows.map(r => `<div class="l">${esc(r.l)}</div><div class="num">${esc(r.s)}</div><div class="num">${esc(r.m)}${r.n ? `<br><span class="note ${r.n[0]}">${esc(r.n[1])}</span>` : ''}</div>`).join('')}
      </div>
      <div class="bubble"><b>${esc(p.name)}の${esc(g)}のころ</b>${esc(p.texts[g])}</div>
    </section>`;
  } else {
    cmp = `<section class="card section"><h2>今の自分と比べてみる</h2><p class="lead">学年や勉強時間を入れると、${esc(p.name)}が同じ学年だったころと並べて、差が分かります。</p><div><a class="btn btn-yellow" href="#form">自分の状態を入れる</a></div></section>`;
  }
  const recs = p.books.map(b => ({ b, rec: g && ((me.weak && b.subj === me.weak) || b.start_grade === g) }));
  const tl = p.grades.map(gr => {
    const h = p.hantei[gr];
    const meta = [p.hensachi[gr] != null ? `偏差値 ${p.hensachi[gr]}` : '', p.rank[gr] != null ? `校内 ${p.rank[gr]}位／${p.N}人` : '', h ? `冠模試 夏${h[0]} → 秋${h[1]}` : ''].filter(Boolean).join('　');
    return `<div class="tl-row${gr === g ? ' now' : ''}"><div class="tl-g">${esc(gr)}</div><div>
      <div class="bar"><span style="width:${Math.max(3, p.hours[gr] / 12 * 100)}%"></span><em class="num">平日${fh(p.hours[gr])}時間</em></div>
      ${meta ? `<div class="tl-meta num">${esc(meta)}</div>` : ''}<p>${esc(p.texts[gr])}</p></div></div>`;
  }).join('');
  let weakTop = '';
  if (g && me.weak) {
    const cnt = {};
    P.filter(q => q.weak === me.weak && q.bunri === me.bunri).forEach(q => q.books.forEach(b => { if (b.subj === me.weak) cnt[b.name] = (cnt[b.name] || 0) + 1; }));
    const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 4);
    if (top.length) weakTop = `<section class="section"><h2>${esc(me.weak)}が苦手だった先輩が使った本</h2><p class="lead">${esc(me.bunri)}で${esc(me.weak)}が苦手だった先輩たちの、${esc(me.weak)}の本です。</p>
      <div class="list">${top.map(([n, c]) => `<a class="card s-card" href="#b-${bookIdx[n]}"><div class="b-top"><div class="b-name">${esc(n)}</div><span class="score num">${c}人<small>が使用</small></span></div></a>`).join('')}</div></section>`;
  }
  return `
  <div><a href="${hasMe() ? '#result' : '#browse'}" class="small">← ${hasMe() ? '近い先輩に戻る' : '先輩一覧に戻る'}</a></div>
  <section class="card section">
    <div class="s-head"><span class="avatar lg">${esc(initial(p))}</span><div>
      <h1 style="font-size:1.5rem">${esc(p.name)}</h1>
      <div class="tags" style="margin-top:4px"><span class="tag tag-b">${esc(p.rui)}</span><span class="tag tag-b">${esc(p.gen)}合格</span><span class="tag">${p.year}年度入学</span><span class="tag">${esc(p.bunri)}</span></div></div></div>
    <p class="quote">${esc(p.summary)}</p>
    <dl class="facts">${facts.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
  </section>
  ${hasMe() ? meBar() : ''}
  ${cmp}
  ${p.fail_reason ? `<div class="warn"><b>現役で落ちた理由</b><br>${esc(p.fail_reason)}</div>` : ''}
  <section class="section"><h2>高1から合格まで</h2><div class="card tl">${tl}</div></section>
  <section class="section"><h2>${esc(p.name)}が使った参考書</h2>${g ? '<p class="lead">黄色の枠は、あなたの苦手科目の本か、あなたと同じ学年から使い始めた本です。</p>' : ''}
    <div class="list">${recs.map(x => bookCard(p, x.b, x.rec)).join('')}</div></section>
  ${weakTop}`;
}

function vBrowse() {
  if (!bf._init) { bf.bunri = me.bunri || ''; bf._init = true; }
  let list = P.filter(p => (!bf.bunri || p.bunri === bf.bunri) && (!bf.region || p.region === bf.region) && (!bf.gen || (bf.gen === '現役' ? p.nro === 0 : p.nro > 0)) && (!bf.juku || jukuCat(p.juku) === bf.juku) && (!bf.style || p.style === bf.style));
  let ms = null;
  if (hasMe()) { ms = Object.fromEntries(P.map(p => [p.id, match(p)])); list = list.slice().sort((a, b) => ms[b.id].pct - ms[a.id].pct); }
  const row = (label, field, opts) => `<div class="f"><span>${label}</span><div class="chips">${chip('bf', field, '', 'すべて', bf[field] === '')}${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return chip('bf', field, v, l, bf[field] === v); }).join('')}</div></div>`;
  return `
  <section class="section"><h1>先輩一覧</h1><p class="lead">東大に合格した先輩100人（架空のサンプル）。条件でしぼりこめます。${hasMe() ? 'あなたに近い順に並んでいます。' : ''}</p></section>
  <div class="filters">
    ${row('文理', 'bunri', ['文系', '理系'])}
    ${row('地域', 'region', REGIONS)}
    ${row('現役・浪人', 'gen', ['現役', '浪人'])}
    ${row('塾', 'juku', JUKU)}
    ${row('スタイル', 'style', Object.entries(STYLE))}
  </div>
  <p><span class="count num">${list.length}人</span><span class="muted small">　が当てはまります</span></p>
  <div class="list">${list.length ? list.map(p => sCard(p, ms && ms[p.id])).join('') : '<div class="card">この条件の先輩はいません。条件をひとつ外してみてください。</div>'}</div>`;
}

function vBooks() {
  if (!bk._init) { bk.subj = me.weak || ''; bk._init = true; }
  const subjOpts = ['英語', '数学', '国語', '物理', '化学', '生物', '世界史', '日本史', '地理', ['過去問', '過去問・添削']];
  let list = BOOKS.filter(b => (!bk.subj || (bk.subj === '過去問' ? (b.subj === '複数' || b.subj === '共通テスト' || /25カ年/.test(b.name)) : b.subj === bk.subj)) && (!bk.kind || (bk.kind === '市販' ? b.kind === '市販' : b.kind !== '市販')));
  list = list.slice().sort((a, b) => b.uses.length - a.uses.length || a.name.localeCompare(b.name));
  const row = (label, field, opts) => `<div class="f"><span>${label}</span><div class="chips">${chip('bk', field, '', 'すべて', bk[field] === '')}${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return chip('bk', field, v, l, bk[field] === v); }).join('')}</div></div>`;
  return `
  <section class="section"><h1>参考書から探す</h1><p class="lead">先輩たちが実際に使った本を、使った人数の多い順に並べました。開くと、いつ・どう使ったかが読めます。</p></section>
  <div class="filters">${row('科目', 'subj', subjOpts)}${row('種類', 'kind', [['市販', '市販の参考書'], ['塾', '塾・学校の教材']])}</div>
  <p><span class="count num">${list.length}冊</span></p>
  <div class="list">${list.map(b => {
    const st = {}; b.uses.forEach(u => st[u.b.start_grade] = (st[u.b.start_grade] || 0) + 1);
    const top = Object.entries(st).sort((x, y) => y[1] - x[1])[0][0];
    return `<a class="card s-card" href="#b-${b.i}"><div class="b-top"><div><div class="b-name">${esc(b.name)}</div>
      <div class="tags" style="margin-top:4px"><span class="tag tag-b">${esc(b.subj === '複数' ? '複数科目' : b.subj)}</span><span class="tag">${esc(b.kind)}</span><span class="tag">よく使い始めた時期：${esc(top)}</span></div></div>
      <span class="score num">${b.uses.length}人<small>が使用</small></span></div>
      <p class="s-sum muted">${esc(b.uses[0].b.purpose.replace(/^苦手の.+?を立て直すため。/, ''))}</p></a>`;
  }).join('')}</div>`;
}

function vBook(i) {
  const b = BOOKS[i];
  if (!b) return `<section class="card"><h2>その参考書は見つかりませんでした</h2><p><a href="#books">参考書一覧へ</a></p></section>`;
  const avg = k => (b.uses.reduce((s, u) => s + u.b[k], 0) / b.uses.length).toFixed(1);
  const st = {}; b.uses.forEach(u => st[u.b.start_grade] = (st[u.b.start_grade] || 0) + 1);
  return `
  <div><a href="#books" class="small">← 参考書一覧に戻る</a></div>
  <section class="card section">
    <h1 style="font-size:1.5rem">${esc(b.name)}</h1>
    <div class="tags"><span class="tag tag-b">${esc(b.subj === '複数' ? '複数科目' : b.subj)}</span><span class="tag">${esc(b.kind)}</span></div>
    <div class="stat num"><div><b>${b.uses.length}人</b><span>使った先輩</span></div><div><b>${avg('level')}</b><span>難易度（5段階）</span></div><div><b>${avg('vol')}</b><span>分量（5段階）</span></div><div><b>${avg('expl')}</b><span>解説の充実（5段階）</span></div></div>
    <p class="small"><b>使い始めた時期</b>　${START_ORDER.filter(k => st[k]).map(k => `${k} ${st[k]}人`).join('　')}</p>
  </section>
  <section class="section"><h2>使った先輩の声</h2>
  <div class="list">${b.uses.map(({ p, b: x }) => `<article class="card b-card">
    <a class="s-head" href="#s-${p.id}" style="text-decoration:none;color:var(--ink)"><span class="avatar">${esc(initial(p))}</span><div><div class="s-name">${esc(p.name)}</div><div class="s-sub">${esc(p.rui)}・${esc(p.gen)}・${esc(p.pref)}・苦手 ${esc(p.weak)}</div></div></a>
    <div class="tags"><span class="tag tag-y">${esc(x.start === x.end ? x.start : x.start + '〜' + x.end)}</span></div>
    <dl class="kv"><dt>目的</dt><dd>${esc(x.purpose)}</dd><dt>使い方</dt><dd>${esc(x.use)}</dd><dt>良かった</dt><dd class="good">${esc(x.good)}</dd><dt>注意</dt><dd>${esc(x.bad)}</dd></dl>
  </article>`).join('')}</div></section>`;
}

/* router */
const app = document.getElementById('app');
function render(keep) {
  const r = location.hash.slice(1) || 'top';
  let html, nav = '';
  if (r === 'q-bunri' || r === 'q-pick' || r === 'q-goal') { html = vQ(r.slice(2)); nav = 'q'; }
  else if (r === 'form') { html = vForm(); nav = 'q'; }
  else if (r === 'result') { html = vResult(); nav = 'q'; }
  else if (r === 'browse') { html = vBrowse(); nav = 'browse'; }
  else if (r === 'books') { html = vBooks(); nav = 'books'; }
  else if (r.startsWith('b-')) { html = vBook(+r.slice(2)); nav = 'books'; }
  else if (r.startsWith('s-')) { html = vSenpai(r.slice(2)); nav = 'browse'; }
  else html = vTop();
  const y = window.scrollY;
  app.innerHTML = html;
  document.querySelectorAll('.nav a').forEach(a => a.toggleAttribute('aria-current', a.dataset.nav === nav) || (a.dataset.nav === nav && a.setAttribute('aria-current', 'page')));
  document.querySelectorAll('.nav a').forEach(a => { if (a.dataset.nav === nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  window.scrollTo(0, keep ? y : 0);
}
const go = h => { if (location.hash === '#' + h) render(); else location.hash = h; };
window.addEventListener('hashchange', () => render());

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const { act, field, val } = t.dataset;
  if (act === 'go') go(val);
  else if (act === 'pick') { setBunri(val); save(); go('q-goal'); }
  else if (act === 'goal') { if (val === 'yes') { bk.subj = me.weak || ''; bk._init = true; go('books'); } else go('form'); }
  else if (act === 'set') {
    if (field === 'bunri') setBunri(val);
    else me[field] = me[field] === val && !['grade'].includes(field) ? null : val;
    if (field === 'strong' && me.strong === me.weak) me.weak = null;
    if (field === 'weak' && me.weak === me.strong) me.strong = null;
    delete errs[field]; save(); render(true);
  }
  else if (act === 'multi') { const a = me[field] || []; me[field] = a.includes(val) ? a.filter(x => x !== val) : a.concat(val); save(); render(true); }
  else if (act === 'bf') { bf[field] = val; render(true); }
  else if (act === 'bk') { bk[field] = val; render(true); }
  else if (act === 'clear') { me = Object.assign({}, blank, { rui: [] }); errs = {}; save(); render(true); }
  else if (act === 'submit') {
    errs = {};
    if (!me.bunri) errs.bunri = '文系か理系かを選んでください。';
    if (!me.grade) errs.grade = '学年を選んでください。';
    const hv = document.getElementById('hensachi').value;
    if (hv !== '' && (+hv < 30 || +hv > 85)) errs.hensachi = '偏差値は30〜85の数字で入れてください。';
    if (Object.keys(errs).length) { render(true); const el = document.querySelector('.err'); el && el.scrollIntoView({ block: 'center' }); return; }
    bf._init = false; save(); go('result');
  }
});
function setBunri(v) {
  me.bunri = v;
  me.rui = (me.rui || []).filter(r => RUI[v].includes(r));
  if (me.weak && !SUBJ[v].includes(me.weak)) me.weak = null;
  if (me.strong && !SUBJ[v].includes(me.strong)) me.strong = null;
}
document.addEventListener('input', e => {
  if (e.target.id === 'hours') { me.hours = +e.target.value; document.getElementById('hours-out').textContent = fh(me.hours) + '時間'; save(); }
  if (e.target.id === 'juku') { me.jukuText = e.target.value; me.juku = parseJuku(me.jukuText); document.getElementById('juku-hint').innerHTML = jukuHint(); save(); }
  if (e.target.id === 'hensachi') { const v = e.target.value; me.hensachi = v === '' ? null : Math.round(+v); delete errs.hensachi; save(); }
});
render();
</script>

</body>
